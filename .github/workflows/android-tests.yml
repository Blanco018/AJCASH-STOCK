name: Android CI - Mobile QA Automation Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-regression-tests:
    name: Run Unit Tests & Business Logic Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests & Robolectric Suite (AJCashStocks)
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Publish Test Report Summary to PR / Run Checks
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Test Execution Report
          path: app/build/test-results/testDebugUnitTest/*.xml
          reporter: java-junit
