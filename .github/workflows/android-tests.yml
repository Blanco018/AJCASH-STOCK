name: Android CI - Mobile QA Automation Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-regression-tests:
    name: Run Unit Tests & Business Logic Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "Searching for gradlew in repository..."
            find . -type f -name "gradlew" -exec chmod +x {} +
          fi

      - name: Run Unit Tests & Robolectric Suite (AJCashStocks)
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/build/reports/tests/testDebugUnitTest/**"
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Test Report Summary to PR / Run Checks
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Test Execution Report
          path: "**/build/test-results/testDebugUnitTest/*.xml"
          reporter: java-junit
          fail-on-empty: false
